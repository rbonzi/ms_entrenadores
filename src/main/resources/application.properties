spring.application.name=ms-entrenadores
server.port=8088

spring.datasource.url=jdbc:mysql://localhost:3306/entrenadores_bd
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#update: crea las tablas si no existen, las actualiza
#si el modelo cambió. Esto es ideal para desarrollo local
#uy así entender lo que ocurre internamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
